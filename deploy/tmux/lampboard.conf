# LampBoard's tmux options, for a machine whose sessions a phone opens (the mobile
# plan's decision Q10 and its finding E14). What runs on a machine comes from a
# repository (ADR-59 of the node's register): Scripts/lampd-install.sh copies this
# file to ~/.config/lampd/tmux.conf, marked with its commit, and never edits the
# person's own ~/.tmux.conf. One line there reads it, the owner's own gesture:
#
#   source-file -q ~/.config/lampd/tmux.conf
#
# It takes effect for a server started after that line (or `tmux source-file` by
# hand); `lampd doctor` says whether the running server has it.

# E14: tmux asks every client for focus reports and passes focus-in and
# focus-out on. A phone that went away with its connection still open leaves a
# client that holds the window's size; the next focus-in from the Mac's terminal
# is what gives the size back, the last net under the background rule (Q7).
set -s focus-events on

# Q10: Shift+Enter reaches Claude Code inside tmux as a key of its own (a new
# line in the prompt, from the Mac as from an iPad keyboard), as Claude Code's
# terminal page asks for tmux.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Q10: Claude Code's notifications and progress, from inside tmux.
set -g allow-passthrough on

# Q10: a long conversation can be read back in tmux (2000 by default).
set -g history-limit 50000
